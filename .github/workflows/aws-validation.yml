name: Validate student registration and AWS template

on:
  push:
    branches: [main, validate-aws-deployment-20261009]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install application and infrastructure validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r student-registration/requirements.txt cfn-lint

      - name: Validate CloudFormation resource schema
        run: cfn-lint --template infrastructure/aws-flask-stack.yaml

      - name: Run Flask registration smoke tests
        env:
          PYTHONPATH: student-registration
        run: python -m unittest discover -s tests -v
